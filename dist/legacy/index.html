<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafa">
  <meta name="description" content="A little balance. An evidence-informed supplement planner, expressed as a kinetic sculpture.">
  <title>Equilibrium — A little balance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='16' fill='none' stroke='%23243b36' stroke-width='2'/%3E%3Cpath d='M4 20h32M20 4v32' stroke='%23243b36'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wordmark"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5"/><path d="M3.5 16h25M16 3.5v25"/><circle cx="16" cy="16" r="5"/></svg>equilibrium</div>
    <span class="mode"><span class="mode-dot"></span> Healthy-adult reference</span>
  </header>
  <main>
    <div class="intro"><h1>A little balance.</h1><p>Choose what matters to you. Let the evidence shape the blend.</p></div>
    <div class="installation">
      <section class="goals" id="goals" aria-label="Health goal priorities"></section>
      <div class="machine" aria-label="Metallic tracks connect the goals to a glass supplement reservoir">
        <svg id="sculpture" viewBox="0 0 1200 500" role="img" aria-label="A polished kinetic sculpture with shared tracks and a rotating wheel"></svg>
        <canvas id="balls" aria-hidden="true"></canvas>
      </div>
      <section class="dosages" id="dosages" aria-label="Suggested reference daily quantities"></section>
      <div class="plan-note"><span class="note-dot"></span><p id="rationale">Preparing the reference plan…</p></div>
    </div>
  </main>
  <footer><span>Adult reference. Health, medicines & current intake not checked.</span><button id="evidence-button" class="text-button">Evidence & assumptions <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.3"/><path d="M8 7v4M8 4.6v.3"/></svg></button></footer>
  <div id="detail" class="detail" role="dialog" aria-labelledby="detail-title" popover></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">Enable JavaScript to adjust priorities and see the reference plan.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
