    <circle cx="1293" cy="617" r="3"/><circle cx="1337" cy="652" r="3"/><circle cx="1308" cy="728" r="3"/><circle cx="1355" cy="780" r="3"/>
    <circle cx="299" cy="1069" r="3"/><circle cx="332" cy="1015" r="3"/><circle cx="398" cy="1041" r="3"/><circle cx="433" cy="999" r="3"/>
  </g>
  <use href="#fourStar" transform="translate(645 328) scale(1.1)"/>
  <use href="#fourStar" transform="translate(1410 424) scale(.8)"/>
  <use href="#fourStar" transform="translate(1160 615) scale(.72)"/>
  <use href="#fourStar" transform="translate(237 873) scale(.85)"/>
  <use href="#fourStar" transform="translate(529 1167) scale(.8)"/>
  <use href="#fourStar" transform="translate(1096 1214) scale(.85)"/>
  <use href="#littleStar" transform="translate(150 389)"/>
  <use href="#littleStar" transform="translate(647 129)"/>
  <use href="#littleStar" transform="translate(964 306)"/>
  <use href="#littleStar" transform="translate(1045 465)"/>
  <use href="#littleStar" transform="translate(1276 920)"/>
  <use href="#littleStar" transform="translate(404 676)"/>
  <use href="#littleStar" transform="translate(871 1143)"/>
  <use href="#littleStar" transform="translate(611 1028)"/>
  <use href="#asteroid" transform="translate(629 449) rotate(25) scale(.65)"/>
  <use href="#asteroid" transform="translate(1411 562) rotate(-18) scale(.62)"/>
  <use href="#asteroid" transform="translate(241 977) rotate(-32) scale(.8)"/>
  <use href="#asteroid" transform="translate(1013 1270) rotate(32) scale(.55)"/>

  <!-- Screen-printed arcade arrows sit clear of the raised lower-right bumper. -->
  <g fill="#923543" stroke="#b69658" stroke-width="1.5">
    <path d="m1122 1097 17-18 17 18-17-6Z"/>
    <path d="m1122 1120 17-18 17 18-17-6Z"/>
    <path d="m1122 1143 17-18 17 18-17-6Z"/>
  </g>
  <path d="M540 1262h149l24-24h174l24 24h149" fill="none" stroke="#652c3d" stroke-width="7"/>
  <path d="M540 1276h155l24-24h162l24 24h155" fill="none" stroke="#a98a52" stroke-width="1.5"/>
  <path d="M627 1315h81M892 1315h81" fill="none" stroke="#415679" stroke-width="3"/>
