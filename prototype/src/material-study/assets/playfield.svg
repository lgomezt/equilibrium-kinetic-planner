    <path d="M696 202 738 165 803 185 858 150 906 192"/>
    <path d="M1293 617 1337 652 1308 728 1355 780"/>
    <path d="M299 1069 332 1015 398 1041 433 999"/>
    <ellipse cx="322" cy="1161" rx="98" ry="32" transform="rotate(-28 322 1161)"/>
    <circle cx="322" cy="1161" r="49" stroke="#57627d"/>
    <path d="M271 1113q52-48 109 6M310 1230l13-21" stroke="#a38550"/>
