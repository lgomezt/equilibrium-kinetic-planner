    <g fill="none" stroke="#384e74" stroke-width="2" opacity=".74">
      <circle r="158"/>
      <circle r="174" stroke-width="1" opacity=".45"/>
      <path d="M-127-113a170 170 0 0 1 248-7M154 74a171 171 0 0 1-218 85" stroke="#9b7749" stroke-width="3"/>
    </g>
    <path d="M-23 110q-31 60 8 125l15-47 15 65q45-82 8-143Z" fill="url(#flame)"/>
    <path d="M-11 113q-13 52 11 91 20-49 11-91Z" fill="#efd59b" opacity=".65"/>
    <path d="M-28 44-73 103-76 143-31 117ZM28 44l45 59 3 40-45-26Z" fill="url(#red)" stroke="#1b1e36" stroke-width="4"/>
    <path d="m-67 115 34-48M34 67l32 48" fill="none" stroke="#efb1a2" stroke-width="2" opacity=".7"/>
    <path d="M0-146q-47 44-41 135l10 117h62L41-11Q47-102 0-146Z" fill="url(#silver)" stroke="#141e37" stroke-width="5"/>
    <path d="M0-146q-24 23-34 60h68Q23-123 0-146Z" fill="url(#red)" stroke="#1b2039" stroke-width="2"/>
    <path d="M-26-82q-12 45-7 89l8 77" fill="none" stroke="#f2ebe0" stroke-width="3" opacity=".68"/>
    <path d="M24-78q11 43 6 87l-7 76" fill="none" stroke="#536278" stroke-width="2"/>
    <ellipse cy="-36" rx="25" ry="30" fill="#222c44" stroke="#bca16a" stroke-width="5"/>
    <ellipse cy="-36" rx="18" ry="23" fill="#233e6a" stroke="#677b9e" stroke-width="2"/>
    <path d="M-11-48q10-10 20-1" fill="none" stroke="#a4b9d5" stroke-width="3" opacity=".67"/>
    <path d="M-31 82h62v24h-62Z" fill="url(#red)" stroke="#23273e" stroke-width="3"/>
    <path d="M-31 89h62" fill="none" stroke="#f2b091" stroke-width="2" opacity=".55"/>
    <path d="M-26 108h52l-7 17h-38Z" fill="#8392a5" stroke="#19243a" stroke-width="3"/>
    <path d="M-5 27 0 8 5 27 24 32 5 37 0 56-5 37-24 32Z" fill="#b79856" stroke="#6a664d" stroke-width="1"/>
  </g>

