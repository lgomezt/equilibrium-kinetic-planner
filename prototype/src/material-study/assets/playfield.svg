<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400">
  <title>Midnight orbital playfield</title>
  <desc>Original printed pinball artwork: violet Saturn, silver and red rocket, fine gold orbital marks, and layered arcade pinstripes on midnight navy.</desc>
  <defs>
    <radialGradient id="navy" cx="47%" cy="36%" r="75%">
      <stop offset="0" stop-color="#142b50"/>
      <stop offset=".46" stop-color="#0c1b38"/>
      <stop offset="1" stop-color="#050c20"/>
    </radialGradient>
    <radialGradient id="saturn" cx="29%" cy="24%" r="86%">
      <stop offset="0" stop-color="#b3a5f0"/>
      <stop offset=".28" stop-color="#7372cf"/>
      <stop offset=".64" stop-color="#3e4491"/>
      <stop offset="1" stop-color="#171e56"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f6dea0"/>
      <stop offset=".35" stop-color="#b8974d"/>
      <stop offset=".58" stop-color="#ebcc80"/>
      <stop offset="1" stop-color="#7d5b30"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="1">
      <stop offset="0" stop-color="#586479"/>
      <stop offset=".19" stop-color="#bcc8d7"/>
      <stop offset=".42" stop-color="#e5e7e7"/>
      <stop offset=".64" stop-color="#a7b6c7"/>
      <stop offset="1" stop-color="#4c5d75"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2=".8">
      <stop offset="0" stop-color="#e44a48"/>
      <stop offset=".45" stop-color="#9f232f"/>
      <stop offset="1" stop-color="#481428"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dd91"/>
      <stop offset=".45" stop-color="#cd9846"/>
      <stop offset="1" stop-color="#93503a" stop-opacity=".12"/>
    </linearGradient>
    <clipPath id="planetDisc"><circle cx="344" cy="335" r="146"/></clipPath>
    <g id="fourStar" fill="#d6b66e">
      <path d="M0-13 3-3 13 0 3 3 0 13-3 3-13 0-3-3Z"/>
      <circle r="2.2" fill="#f3dba0"/>
    </g>
    <g id="littleStar" fill="#9b874f"><path d="M0-5 1.5-1.5 5 0 1.5 1.5 0 5-1.5 1.5-5 0-1.5-1.5Z"/></g>
    <g id="asteroid">
      <path d="m-21-11 14-14 21 6 13 16-5 19-20 8-24-10Z" fill="#2d3b56" stroke="#64718b" stroke-width="2"/>
      <path d="m-17-9 11-8 17 3M-9 16l5-10 17 1 7-7" fill="none" stroke="#89919f" stroke-width="2" opacity=".45"/>
      <path d="m-20 1 13-3 8 9-4 12M12-17 6-6l13 4" fill="none" stroke="#0c1831" stroke-width="3"/>
    </g>
  </defs>

  <!-- Rich ink foundation. The broad clear center belongs to the mechanism. -->
  <rect width="1600" height="1400" fill="url(#navy)"/>
  <path d="M33 111V62h66M1501 62h66v49M33 1289v49h66M1501 1338h66v-49" fill="none" stroke="#9a703f" stroke-width="3"/>
  <path d="M54 173V82h111M1435 82h111v91M54 1227v91h111M1435 1318h111v-91" fill="none" stroke="#702237" stroke-width="7"/>
  <path d="M72 184V100h89M1439 100h89v84M72 1216v84h89M1439 1300h89v-84" fill="none" stroke="#bd9858" stroke-width="1.5"/>

  <!-- Layered screen-printed side pinstripes: deliberately asymmetric. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M107 505v125l82 82v169l-82 82v178" stroke="#813142" stroke-width="7"/>
    <path d="M121 505v119l82 82v181l-82 82v172" stroke="#b79451" stroke-width="2"/>
    <path d="M135 520v99l82 82v192l-82 82v150" stroke="#34486b" stroke-width="4"/>
    <path d="M1493 479v146l-92 92v170l92 92v142" stroke="#873141" stroke-width="7"/>
    <path d="M1479 479v140l-92 92v182l92 92v136" stroke="#b79451" stroke-width="2"/>
    <path d="M1465 493v119l-92 92v196l92 92v116" stroke="#34486b" stroke-width="4"/>
    <path d="M261 94h148l31 31h111M1049 125h110l32-31h151" stroke="#5f263c" stroke-width="7"/>
    <path d="M262 108h141l31 31h117M1049 139h116l32-31h144" stroke="#b69450" stroke-width="2"/>
    <path d="M268 123h128l31 31h82M1091 154h81l31-31h124" stroke="#334969" stroke-width="3"/>
  </g>

  <!-- Fine orbital printing sits behind the planet, like layered ink. -->
  <g transform="translate(-19 170)">
  <g fill="none" stroke="#526184">
    <circle cx="344" cy="335" r="208" stroke-width="1.8" opacity=".47"/>
    <circle cx="344" cy="335" r="224" stroke-width="1" opacity=".24"/>
    <path d="M177 198a215 215 0 0 1 309-27M527 466a219 219 0 0 1-298 50" stroke="#ba9354" stroke-width="3" opacity=".56"/>
    <path d="m190 177-12-14m342 316 13 14M342 111v14M344 545v14" stroke="#bf9558" stroke-width="2"/>
  </g>

