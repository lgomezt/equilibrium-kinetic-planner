    <ellipse cx="344" cy="335" rx="258" ry="74" stroke="#081029" stroke-width="23"/>
    <ellipse cx="344" cy="335" rx="258" ry="74" stroke="#aa7d41" stroke-width="18"/>
    <ellipse cx="344" cy="335" rx="258" ry="74" stroke="#e2c27b" stroke-width="5"/>
    <ellipse cx="344" cy="335" rx="239" ry="63" stroke="#baa061" stroke-width="4"/>
    <ellipse cx="344" cy="335" rx="269" ry="81" stroke="#7a6444" stroke-width="1.4"/>
  </g>
  <circle cx="344" cy="335" r="149" fill="#0c1435"/>
  <circle cx="344" cy="335" r="146" fill="url(#saturn)" stroke="#868ac6" stroke-width="2"/>
  <g clip-path="url(#planetDisc)" transform="rotate(-17 344 335)" fill="none">
    <path d="M183 240q155 46 317 0M177 266q165 52 332 0" stroke="#c2b1e5" stroke-width="10" opacity=".3"/>
    <path d="M182 288q154 53 324 2" stroke="#263370" stroke-width="18" opacity=".44"/>
    <path d="M184 306q157 54 319 3M178 330q167 60 334 0" stroke="#9994d5" stroke-width="5" opacity=".54"/>
    <path d="M181 351q157 53 323 0" stroke="#b9a0d8" stroke-width="15" opacity=".29"/>
    <path d="M180 375q165 46 330-3M188 407q146 48 304-3" stroke="#18275e" stroke-width="15" opacity=".52"/>
    <path d="M195 431q145 33 295-1" stroke="#7274b4" stroke-width="6" opacity=".32"/>
  </g>
  <path d="M243 267a123 123 0 0 1 112-52" fill="none" stroke="#d7bfea" stroke-width="3" opacity=".55"/>
  <g transform="rotate(-22 344 335)" fill="none">
    <path d="M86 335a258 74 0 0 0 516 0" stroke="#342540" stroke-width="23"/>
    <path d="M86 335a258 74 0 0 0 516 0" stroke="url(#gold)" stroke-width="18"/>
    <path d="M86 335a258 74 0 0 0 516 0" stroke="#efd394" stroke-width="3"/>
    <path d="M105 335a239 63 0 0 0 478 0" stroke="#bba067" stroke-width="4"/>
    <path d="M75 335a269 81 0 0 0 538 0" stroke="#937648" stroke-width="1.4"/>
  </g>
  </g>

  <!-- Rocket insignia: painted steel, red enamel, gold flame, no model clutter. -->
